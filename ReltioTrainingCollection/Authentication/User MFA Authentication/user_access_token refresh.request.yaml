$kind: http-request
url: https://auth.reltio.com/oauth/token
method: POST
headers:
  Authorization: Basic {{userClient}}
  Content-Type: application/json
body:
  type: formdata
  content:
    - type: text
      key: refresh_token
      value: "{{refresh_token}}"
    - type: text
      key: grant_type
      value: refresh_token
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: |-
      var jsonData = pm.response.json();
      pm.environment.set("accessToken", jsonData.access_token);
      pm.environment.set("refresh_token", jsonData.refresh_token);
    language: text/javascript
order: 3000
