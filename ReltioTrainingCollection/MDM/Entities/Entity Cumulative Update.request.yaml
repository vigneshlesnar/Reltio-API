$kind: http-request
description: "[https://docs.reltio.com/entitiesapi/cumulativeentityupdate.html](https://docs.reltio.com/entitiesapi/cumulativeentityupdate.html)"
url: "{{tenantURL}}/entities/<entityID>/_update"
method: POST
headers:
  Authorization: Bearer {{accessToken}}
  Content-Type: application/json
queryParams:
  - key: options
    value: partialOverride
    disabled: true
body:
  type: text
  content: "[\r

    \    {\r

    \        \"type\": \"DELETE_ATTRIBUTE\",\r

    \        \"uri\": \"entities/<entityID>/attributes/DoB/<attributeID>\",\r

    \        \"crosswalk\": {\r

    \            \"type\": \"configuration/sources/<sourceType>\",\r

    \            \"value\": \"<crosswalkID>\"\r

    \        }\r

    \    },\r

    \    {\r

    \        \"type\": \"INSERT_ATTRIBUTE\",\r

    \        \"uri\": \"configuration/entityTypes/<EnitityName>/attributes/<AttributeName>\",\r

    \        \"crosswalk\": {\r

    \            \"type\": \"configuration/sources/<sourceType>\",\r

    \            \"value\": \"<crosswalkID>\"\r

    \        },\r

    \        \"newValue\": [\r

    \            {\r

    \                \"value\": \"<valueA>\"\r

    \            }\r

    \        ]\r

    \    },\r

    \    {\r

    \        \"type\": \"UPDATE_ATTRIBUTE\",\r

    \        \"uri\": \"entities/<entityID>/attributes/LastName/<attributeID>\",\r

    \        \"crosswalk\": {\r

    \            \"type\": \"configuration/sources/<sourceType>\",\r

    \            \"value\": \"<crosswalkID>\"\r

    \        },\r

    \        \"newValue\": [\r

    \            {\r

    \                \"value\": \"<valueB>\"\r

    \            }\r

    \        ]\r

    \    },\r

    \    {\r

    \        \"type\": \"IGNORE_ATTRIBUTE\",\r

    \        \"uri\": \"entities/<entityID>/attributes/MiddleName/<attributeID>\",\r

    \        \"newValue\": [\r

    \            {\r

    \                \"value\": true\r

    \            }\r

    \        ]\r

    \    }\r

    ]"
order: 5000
