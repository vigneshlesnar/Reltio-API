    {
        "fuzzy": true,
        "values": [
            "isabelle",
            "isabela",
            "isabel",
            "Devoti",
            "Devat"
        ],
        "matchTokenClass": {
            "class": "com.reltio.match.token.DoubleMetaphoneMatchToken"
        }
    }
order: 3000
