$kind: http-request
description: "[https://docs.reltio.com/dnbapi/dnbbatcreatebatchjob.html](https://docs.reltio.com/dnbapi/dnbbatcreatebatchjob.html)"
url: "{{dnbconnector}}/dnb/batch?plus=true"
method: POST
headers:
