    value: Bearer {{accessToken}}
  - key: Content-Type
    value: application/json
  - key: EnvironmentUrl
    value: https://dev.reltio.com
  - key: tenantID
    value: "{{tenant}}"
  - key: Reltio-Batch-Type
    value: put
  - key: DnB-Ftp
    value: https://plus.dnb.com
