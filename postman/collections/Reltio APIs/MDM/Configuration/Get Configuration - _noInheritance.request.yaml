$kind: http-request
description: "[https://docs.reltio.com/configapi/getconfignoinherit.html](https://docs.reltio.com/configapi/getconfignoinherit.html)"
url: "{{tenantURL}}/configuration/_noInheritance"
method: GET
headers:
  Authorization: Bearer {{accessToken}}
  Content-Type: application/json
scripts:
  - type: afterResponse
    code: |-
      var jsonData = pm.response.json();
      pm.environment.set("L3_config_json", jsonData);
    language: text/javascript
order: 1000
