$kind: http-request
description: "[https://docs.reltio.com/entitiesapi/deleteentity.html](https://docs.reltio.com/entitiesapi/deleteentity.html)"
url: "{{tenantURL}}/relations/<relationID>/crosswalks/<crosswalkURI_ID>/deleteDate"
method: PUT
headers:
  Authorization: Bearer {{accessToken}}
  Content-Type: application/json
body:
  type: json
  content: |-
    {
        "value": "{{currentUnixTime}}"
    }
scripts:
  - type: beforeRequest
    code: |
      pm.variables.set("currentUnixTime", Date.now());
    language: text/javascript
order: 8000
